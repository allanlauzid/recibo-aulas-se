<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#004EB5">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Relatório Sala de Estudo</title>
<style>
:root{--azul:#004EB5;--amarelo:#FFD100;--bg:#f5f7fb;--card:#fff;--txt:#172033;--muted:#667085;--border:#d9e1ec;--red:#b42318;--green:#08783e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--txt)}
header{background:var(--azul);color:#fff;padding:26px 16px;border-bottom:6px solid var(--amarelo)}header>div,main{max-width:1000px;margin:auto}
h1{margin:0 0 5px;font-size:30px}header p{margin:0;opacity:.9}.saved{margin-top:10px;font-size:12px;font-weight:700}
main{padding:16px;display:grid;gap:16px}.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 6px 20px #0000000d}
h2{font-size:19px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
label{font-size:13px;font-weight:700;display:flex;flex-direction:column;gap:6px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;background:#fff;font:inherit}
.row{border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:10px;background:#fbfcfe}
.rowgrid{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.5fr auto;gap:9px;align-items:end}.paygrid{grid-template-columns:1.2fr 1fr 1.2fr auto}
.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:800;cursor:pointer}
.primary{background:var(--azul);color:#fff}.secondary{background:var(--amarelo);color:#222}.ghost{background:#edf3fb;color:#00377f}.danger{background:#fff0f0;color:var(--red)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric{padding:13px;border:1px solid var(--border);border-radius:12px;background:#f8fafc}
.metric span{display:block;font-size:12px;color:var(--muted);font-weight:700}.metric strong{font-size:19px}
textarea{min-height:430px;resize:vertical;font-family:ui-monospace,Consolas,monospace;line-height:1.45}.note{color:var(--muted);font-size:13px}.ok{color:var(--green);font-weight:800}
@media(max-width:760px){.grid,.summary{grid-template-columns:1fr 1fr}.rowgrid,.paygrid{grid-template-columns:1fr 1fr}.rowgrid button,.paygrid button{grid-column:span 2}}
@media(max-width:480px){.grid,.summary,.rowgrid,.paygrid{grid-template-columns:1fr}.rowgrid button,.paygrid button{grid-column:auto}main{padding:10px}.card{padding:14px}}
</style>
</head>
<body>
<header><div><h1>Relatório de Aulas</h1><p>Sala de Estudo</p><div class="saved">● salvamento automático neste aparelho</div></div></header>
<main>
<section class="card">
<h2>1. Configurações</h2>
<div class="grid">
<label>Mês<input id="mes" type="month"></label>
<label>Valor da hora-aula<input id="valorHora" type="number" step="0.01" value="27"></label>
<label>PIX<input id="pix" value="064.233.904-01"></label>
<label>Título<input id="titulo" value="Aulas dadas Sala de Estudo"></label>
</div>
</section>

<section class="card">
<h2>2. Aulas</h2>
<div id="aulas"></div>
<div class="buttons"><button class="secondary" onclick="addAula()">+ Adicionar aula</button></div>
<p class="note">O dia da semana e a duração são calculados automaticamente.</p>
</section>

<section class="card">
<h2>3. Pagamentos</h2>
<div id="pagamentos"></div>
<div class="buttons"><button class="secondary" onclick="addPagamento()">+ Adicionar pagamento</button></div>
</section>

<section class="card">
<h2>4. Resumo</h2>
<div class="summary">
<div class="metric"><span>Horas</span><strong id="sHoras">0h</strong></div>
<div class="metric"><span>A receber</span><strong id="sReceber">R$ 0,00</strong></div>
<div class="metric"><span>Pago</span><strong id="sPago">R$ 0,00</strong></div>
<div class="metric"><span>Balanço</span><strong id="sBalanco">R$ 0,00</strong></div>
</div>
</section>

<section class="card">
<h2>5. Relatório</h2>
<textarea id="saida" readonly></textarea>
<div class="buttons">
<button class="primary" onclick="copiar()">Copiar para WhatsApp</button>
<button class="ghost" onclick="exportarBackup()">Exportar backup</button>
<button class="ghost" onclick="document.getElementById('arquivo').click()">Importar backup</button>
<button class="danger" onclick="limpar()">Limpar tudo</button>
<input id="arquivo" type="file" accept=".json,application/json" hidden>
</div>
<p id="status" class="note"></p>
</section>
</main>

<script>
const KEY="sala_estudo_relatorio_v1";
const alunos=["Vitor Sereno","Outro aluno"];
const meses=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const dias=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const moeda=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function dt(v){if(!v)return null;const [y,m,d]=v.split("-").map(Number);return new Date(y,m-1,d)}
function dataCurta(v){const d=dt(v);return d?String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0"):""}
function semana(v){const d=dt(v);return d?dias[d.getDay()]:""}
function mins(a,b){if(!a||!b)return 0;let [h1,m1]=a.split(":").map(Number),[h2,m2]=b.split(":").map(Number);let x=h1*60+m1,y=h2*60+m2;if(y<x)y+=1440;return y-x}
function horas(m,pad=false){let h=Math.floor(m/60),mm=m%60;return mm?`${pad?String(h).padStart(2,"0"):h}h${String(mm).padStart(2,"0")}`:`${pad?String(h).padStart(2,"0"):h}h`}
function opts(){return alunos.map(a=>`<option>${a}</option>`).join("")}

function bindRow(row){
  row.querySelectorAll("input,select").forEach(e=>{
    e.addEventListener("input",()=>{gerar();salvar()});
    e.addEventListener("change",()=>{gerar();salvar()});
  });
  row.querySelector("button.danger").onclick=()=>{row.remove();gerar();salvar()};
}

function addAula(d={},save=true){
  const row=document.createElement("div"); row.className="row aula";
  row.innerHTML=`<div class="rowgrid">
  <label>Data<input class="data" type="date" value="${d.data||""}"></label>
  <label>Início<input class="inicio" type="time" value="${d.inicio||""}"></label>
  <label>Fim<input class="fim" type="time" value="${d.fim||""}"></label>
  <label>Aluno<select class="aluno">${opts()}</select></label>
  <button class="danger">Remover</button></div>`;
  $("#aulas").appendChild(row);
  if(d.aluno){const s=row.querySelector(".aluno");if(![...s.options].some(o=>o.value===d.aluno))s.add(new Option(d.aluno,d.aluno));s.value=d.aluno}
  bindRow(row); gerar(); if(save)salvar();
}
function addPagamento(d={},save=true){
  const row=document.createElement("div"); row.className="row pagamento";
  row.innerHTML=`<div class="rowgrid paygrid">
  <label>Data<input class="data" type="date" value="${d.data||""}"></label>
  <label>Horário<input class="hora" type="time" value="${d.hora||""}"></label>
  <label>Valor recebido<input class="valor" type="number" step="0.01" value="${d.valor??""}"></label>
  <button class="danger">Remover</button></div>`;
  $("#pagamentos").appendChild(row); bindRow(row); gerar(); if(save)salvar();
}
function estado(){
 return {config:{mes:$("#mes").value,valorHora:$("#valorHora").value,pix:$("#pix").value,titulo:$("#titulo").value},
 aulas:$$(".aula").map(r=>({data:r.querySelector(".data").value,inicio:r.querySelector(".inicio").value,fim:r.querySelector(".fim").value,aluno:r.querySelector(".aluno").value})),
 pagamentos:$$(".pagamento").map(r=>({data:r.querySelector(".data").value,hora:r.querySelector(".hora").value,valor:r.querySelector(".valor").value}))};
}
function salvar(){localStorage.setItem(KEY,JSON.stringify(estado()));$("#status").textContent="Alterações salvas automaticamente.";$("#status").className="note ok"}
function restaurar(){
 const raw=localStorage.getItem(KEY);
 if(!raw){const n=new Date();$("#mes").value=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`;addAula({aluno:"Vitor Sereno"},false);gerar();salvar();return}
 try{
  const x=JSON.parse(raw),c=x.config||{};$("#mes").value=c.mes||"";$("#valorHora").value=c.valorHora??27;$("#pix").value=c.pix??"064.233.904-01";$("#titulo").value=c.titulo||"Aulas dadas Sala de Estudo";
  $("#aulas").innerHTML="";$("#pagamentos").innerHTML="";
  (x.aulas||[]).forEach(a=>addAula(a,false));(x.pagamentos||[]).forEach(p=>addPagamento(p,false));
  if(!(x.aulas||[]).length)addAula({aluno:"Vitor Sereno"},false);gerar();
 }catch(e){console.error(e)}
}
function gerar(){
 let totalM=0,n=1,la=[];
 $$(".aula").forEach(r=>{let d=r.querySelector(".data").value,a=r.querySelector(".inicio").value,b=r.querySelector(".fim").value,al=r.querySelector(".aluno").value;if(!d||!a||!b)return;let m=mins(a,b);totalM+=m;la.push(`${String(n++).padStart(2,"0")}• ${dataCurta(d)} _(${semana(d)})_\ndas ${a} às ${b}\n_(${horas(m)})_\n_${al}_`)});
 let pago=0,np=1,lp=[];
 $$(".pagamento").forEach(r=>{let d=r.querySelector(".data").value,h=r.querySelector(".hora").value,v=Number(r.querySelector(".valor").value||0);if(!d||!v)return;pago+=v;let ht=h?` | ${h.replace(":00","h").replace(":","h")}`:"";lp.push(`$${String(np++).padStart(2,"0")}• ${dataCurta(d)}${ht} | *${moeda(v).replace(/\s/g,"")}*`)});
 const vh=Number($("#valorHora").value||0),receber=(totalM/60)*vh,bal=pago-receber;
 $("#sHoras").textContent=horas(totalM,true);$("#sReceber").textContent=moeda(receber);$("#sPago").textContent=moeda(pago);$("#sBalanco").textContent=moeda(bal);
 const mv=$("#mes").value,mt=mv?meses[Number(mv.split("-")[1])-1]:"";
 let t=`*${$("#titulo").value.trim()||"Aulas dadas Sala de Estudo"}*${mt?`\n_${mt}_`:""}\n\n`;
 t+=la.length?la.join("\n\n"):"_Nenhuma aula cadastrada_";
 t+=`\n\n*_____________________*\n*PAGAMENTOS*\n`;
 t+=lp.length?lp.join("\n"):"_Nenhum pagamento registrado_";
 t+=`\n*_____________________*\n*# TOTAL*\n* de hora-aula: *${horas(totalM,true)}*\n* a receber: *${moeda(receber)}*\n* pago: *${moeda(pago)}*\n\n*# BALANÇO/CRÉDITO*\n_(pago - receber)_: *${bal<0?"- ":""}${moeda(Math.abs(bal))}*\n*_____________________*\nValor: ${moeda(vh).replace(",00","")} hora-aula`;
 if($("#pix").value.trim())t+=`\n*PIX:* ${$("#pix").value.trim()}`;
 $("#saida").value=t;
}
async function copiar(){gerar();try{await navigator.clipboard.writeText($("#saida").value);$("#status").textContent="Relatório copiado.";$("#status").className="note ok"}catch{$("#saida").select();document.execCommand("copy")}}
function exportarBackup(){const blob=new Blob([JSON.stringify(estado(),null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=`sala-estudo-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(u)}
$("#arquivo").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{localStorage.setItem(KEY,JSON.stringify(JSON.parse(r.result)));location.reload()}catch{alert("Backup inválido.")}};r.readAsText(f)});
function limpar(){if(confirm("Apagar todos os dados salvos neste aparelho?")){localStorage.removeItem(KEY);location.reload()}}
["#mes","#valorHora","#pix","#titulo"].forEach(s=>{$(s).addEventListener("input",()=>{gerar();salvar()});$(s).addEventListener("change",()=>{gerar();salvar()})});
window.addEventListener("DOMContentLoaded",restaurar);
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script>
</body>
</html>
